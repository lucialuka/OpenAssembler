[model]
entrypoint = "model.py"
factory = "create_model"
input_shapes = [[128, 128]]
input_dtypes = ["f32"]
math = "f16_rne_f32_accum"
mode = "training"
loss = "mse"
optimizer = "sgd"
learning_rate = 0.01
steps = 3
seed = 7
rtol = 0.002
atol = 0.00002
build_backend = "modal"
gpu = "A100-40GB"
budget = 900

execution = "cuda_graph"
sass_listings = false
