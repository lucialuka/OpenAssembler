[model]
entrypoint = "model.py"
factory = "create_model"
input_shapes = [[17, 8]]
input_dtypes = ["f32"]
math = "fp32"
mode = "training"
loss = "mse"
optimizer = "sgd"
learning_rate = 0.01
steps = 3
seed = 7
rtol = 0.0001
atol = 0.00001
build_backend = "modal"
gpu = "A100-40GB"
budget = 900

execution = "cuda_graph"
sass_listings = false
