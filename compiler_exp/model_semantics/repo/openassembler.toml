[model]
entrypoint = "model.py"
factory = "create_model"
input_shapes = [[2,4]]
input_dtypes = ["i64"]
input_ranges = [[0,11]]
math = "fp32"
mode = "training"
loss = "cross_entropy"
optimizer = "adamw"
beta1 = 0.8
beta2 = 0.95
epsilon = 1e-8
weight_decay = 0.03
optimizer_fusion = true
learning_rate = 0.001
steps = 8
storage_views = true
reuse_storage = true
rtol = 0.0001
atol = 0.00001
