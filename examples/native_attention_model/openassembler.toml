[model]
entrypoint = "model.py"
factory = "create_model"
input_shapes = [[2, 7, 8]]
math = "f16_rne_f32_accum"
tensor_packing = "dual"
execution = "cuda_graph"
sass_listings = false
reuse_storage = true
mode = "training"
learning_rate = 0.01
steps = 3
seed = 7
rtol = 0.002
atol = 0.0002
build_backend = "modal"
gpu = "A100-40GB"
budget = 900
